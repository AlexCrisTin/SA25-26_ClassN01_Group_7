<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Demacia Hotel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Main Navigation -->
    <nav class="main-nav">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">◆</span>
                <span class="logo-text">Demacia</span>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">TRANG CHỦ</a></li>
                <li id="adminNavItem" style="display: none;"><a href="admin.html">ADMIN PANEL</a></li>
                <li><a href="my-bookings.html">ĐẶT PHÒNG CỦA TÔI</a></li>
                <li><a href="rooms.html">PHÒNG NGHỈ</a></li>
                <li><a href="contact.html">LIÊN HỆ</a></li>
                <li><a href="wallet.html">VÍ</a></li>
            </ul>
            <div class="user-menu">
                <span id="userName" class="user-name"></span>
                <button class="logout-btn" onclick="AuthManager.logout()">Đăng Xuất</button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>Dashboard</h1>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <div>
                    <div id="userFullName" class="user-name"></div>
                    <div id="userEmail" style="font-size: 14px; color: #666;"></div>
                </div>
            </div>
        </div>

        <div class="dashboard-section">
            <h2>Phòng Đang Sử Dụng</h2>
            <div id="checkedInRooms">
                <div class="empty-state">
                    <div class="empty-state-icon">🛏️</div>
                    <h3>Chưa có phòng đang sử dụng</h3>
                    <p>Bạn chưa check-in vào phòng nào. Vui lòng đến quầy lễ tân để check-in.</p>
                </div>
            </div>
        </div>

        <div class="dashboard-section">
            <h2>Thông Tin Cá Nhân</h2>
            <form id="profileForm" class="auth-form" style="max-width: 600px;">
                <div class="form-group">
                    <label for="profile_full_name">Họ và tên</label>
                    <input type="text" id="profile_full_name" name="full_name">
                </div>
                <div class="form-group">
                    <label for="profile_email">Email</label>
                    <input type="email" id="profile_email" name="email">
                </div>
                <div class="form-group">
                    <label for="profile_phone">Số điện thoại</label>
                    <input type="tel" id="profile_phone" name="phone">
                </div>
                <button type="submit" class="auth-btn" id="updateProfileBtn">Cập Nhật Thông Tin</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Check authentication
            if (!AuthManager.requireAuth()) {
                return;
            }
            
            // Block admin from accessing dashboard
            if (AuthManager.isAdmin()) {
                AuthManager.blockAdminAccess();
                return;
            }

            const user = AuthManager.getCurrentUser();
            
            // Show admin panel link if user is admin
            if (AuthManager.isAdmin()) {
                document.getElementById('adminNavItem').style.display = 'block';
            }
            
            // Display user info
            document.getElementById('userName').textContent = user.username || user.full_name || 'User';
            document.getElementById('userFullName').textContent = user.full_name || user.username;
            document.getElementById('userEmail').textContent = user.email;
            
            // User avatar
            const avatar = document.getElementById('userAvatar');
            if (user.full_name) {
                avatar.textContent = user.full_name.charAt(0).toUpperCase();
            } else {
                avatar.textContent = user.username.charAt(0).toUpperCase();
            }

            // Load checked-in rooms
            await loadCheckedInRooms(user.id);

            // Load user profile
            await loadUserProfile(user.id);

            // Profile update form
            const profileForm = document.getElementById('profileForm');
            profileForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const updateBtn = document.getElementById('updateProfileBtn');
                
                const profileData = {
                    full_name: document.getElementById('profile_full_name').value,
                    email: document.getElementById('profile_email').value,
                    phone: document.getElementById('profile_phone').value
                };

                setLoading(updateBtn, true);

                try {
                    const updated = await UserAPI.updateProfile(user.id, profileData);
                    showNotification('Cập nhật thông tin thành công!', 'success');
                    
                    // Update current user in localStorage
                    const updatedUser = { ...user, ...updated.user };
                    AuthManager.setCurrentUser(updatedUser);
                    
                    // Refresh display
                    document.getElementById('userFullName').textContent = updatedUser.full_name;
                    document.getElementById('userEmail').textContent = updatedUser.email;
                } catch (error) {
                    showNotification('Lỗi khi cập nhật: ' + error.message, 'error');
                } finally {
                    setLoading(updateBtn, false);
                }
            });
        });

        // Store booking data for updating
        let currentBookingsData = {};

        async function loadCheckedInRooms(userId) {
            const container = document.getElementById('checkedInRooms');
            
            try {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">Đang tải thông tin phòng...</p>';
                
                const bookings = await BookingAPI.getMyBookings();
                console.log('All bookings:', bookings);
                
                // Filter only checked-in bookings
                const checkedInBookings = bookings.filter(b => b.status === 'checked_in');
                console.log('Checked-in bookings:', checkedInBookings);
                
                if (checkedInBookings.length === 0) {
                    // Keep empty state
                    return;
                }

                // Load room details, services, and checkout summary for each checked-in booking
                const roomsData = await Promise.all(
                    checkedInBookings.map(async (booking) => {
                        let room = null;
                        if (booking.room_id) {
                            try {
                                room = await RoomAPI.getRoom(booking.room_id);
                            } catch (error) {
                                console.warn('Could not fetch room info for booking', booking.id, ':', error);
                            }
                        }
                        
                        // Load checkout summary to get service costs
                        let checkoutSummary = null;
                        try {
                            checkoutSummary = await CheckInAPI.getCheckoutSummary(booking.id);
                        } catch (error) {
                            console.warn('Could not load checkout summary for booking', booking.id, ':', error);
                            // Continue without checkout summary - not critical
                        }
                        
                        // Store booking data for later updates
                        currentBookingsData[booking.id] = { booking, room, checkoutSummary };
                        
                        return { booking, room, checkoutSummary };
                    })
                );

                console.log('Rooms data loaded:', roomsData);
                displayCheckedInRooms(roomsData);
            } catch (error) {
                console.error('Error loading checked-in rooms:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Lỗi khi tải thông tin phòng</h3>
                        <p>${error.message || 'Đã xảy ra lỗi không xác định'}</p>
                        <button onclick="location.reload()" class="auth-btn" style="display: inline-block; text-decoration: none; width: auto; padding: 10px 24px; margin-top: 10px;">
                            Tải Lại
                        </button>
                    </div>
                `;
                showNotification('Lỗi khi tải thông tin phòng: ' + error.message, 'error');
            }
        }

        async function displayCheckedInRooms(roomsData) {
            const container = document.getElementById('checkedInRooms');
            
            if (roomsData.length === 0) {
                return; // Keep empty state
            }

            // Load services for order modal
            let services = [];
            try {
                services = await ServiceAPI.getAllServices();
            } catch (error) {
                console.warn('Could not load services:', error);
            }

            container.innerHTML = roomsData.map(({ booking, room, checkoutSummary }) => `
                <div class="checked-in-room-card" style="background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
                        <div>
                            <h3 style="margin: 0 0 8px 0; color: #333;">
                                ${room ? `Phòng ${room.room_number}` : `Đặt phòng #${booking.id}`}
                            </h3>
                            <p style="margin: 0; color: #666; font-size: 14px;">
                                ${booking.room_type} • Mã đặt phòng: #${booking.id}
                            </p>
                        </div>
                        <span class="status-badge status-checked_in" style="background: #4caf50; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;">
                            Đang sử dụng
                        </span>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px;">
                        <div>
                            <p style="margin: 0; color: #999; font-size: 12px; margin-bottom: 4px;">Ngày nhận</p>
                            <p style="margin: 0; font-weight: 500; color: #333;">${formatDate(booking.check_in_date)}</p>
                        </div>
                        <div>
                            <p style="margin: 0; color: #999; font-size: 12px; margin-bottom: 4px;">Ngày trả</p>
                            <p style="margin: 0; font-weight: 500; color: #333;">${booking.check_out_date ? formatDate(booking.check_out_date) : 'N/A'}</p>
                        </div>
                        <div>
                            <p style="margin: 0; color: #999; font-size: 12px; margin-bottom: 4px;">Tổng tiền</p>
                            <p style="margin: 0; font-weight: 500; color: #333;" id="totalPrice-${booking.id}">
                                ${(() => {
                                    const bookingPrice = booking.total_price || 0;
                                    const serviceCost = checkoutSummary ? (checkoutSummary.service_cost || 0) : 0;
                                    const total = bookingPrice + serviceCost;
                                    return total.toLocaleString('vi-VN') + ' VNĐ';
                                })()}
                            </p>
                            ${checkoutSummary && checkoutSummary.service_cost > 0 ? `
                                <p style="margin: 4px 0 0 0; color: #666; font-size: 11px;">
                                    (Phòng: ${(booking.total_price || 0).toLocaleString('vi-VN')} VNĐ + Dịch vụ: ${checkoutSummary.service_cost.toLocaleString('vi-VN')} VNĐ)
                                </p>
                            ` : ''}
                        </div>
                    </div>

                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <button class="auth-btn" onclick="openServiceOrderModal(${booking.id})" style="background: #0066cc; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px;">
                             Đặt Dịch Vụ
                        </button>
                        <button class="auth-btn" onclick="viewOrderedServices(${booking.id})" style="background: #4caf50; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px;">
                             Xem Dịch Vụ Đã Đặt
                        </button>
                        <button class="auth-btn" onclick="viewRoomDetails(${booking.id})" style="background: #f5f5f5; color: #333; border: 1px solid #ddd; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px;">
                             Xem Chi Tiết
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('vi-VN');
        }

        async function openServiceOrderModal(bookingId) {
            // Create modal HTML
            const modal = document.createElement('div');
            modal.id = 'serviceOrderModal';
            modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;';
            
            modal.innerHTML = `
                <div style="background: white; border-radius: 12px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 style="margin: 0;">Đặt Dịch Vụ</h2>
                        <button onclick="closeServiceOrderModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #999;">&times;</button>
                    </div>
                    <div id="serviceOrderList" style="margin-bottom: 20px;">
                        <p style="text-align: center; color: #999;">Đang tải danh sách dịch vụ...</p>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);

            // Load services
            try {
                const services = await ServiceAPI.getAllServices();
                const serviceList = document.getElementById('serviceOrderList');
                
                if (services && services.length > 0) {
                    serviceList.innerHTML = services.map(service => `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 12px;">
                            <div>
                                <h4 style="margin: 0 0 4px 0; font-size: 16px;">${service.service_name || service.name || 'Dịch vụ'}</h4>
                                <p style="margin: 0; color: #666; font-size: 14px;">${service.description || ''}</p>
                                <p style="margin: 4px 0 0 0; color: #0066cc; font-weight: 500;">${service.price ? service.price.toLocaleString('vi-VN') + ' VNĐ' : 'N/A'}</p>
                            </div>
                            <button onclick="orderService(${bookingId}, ${service.id}, '${(service.service_name || service.name || 'Dịch vụ').replace(/'/g, "\\'")}', ${service.price || 0})" 
                                class="auth-btn" style="background: #0066cc; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;">
                                Đặt Ngay
                            </button>
                        </div>
                    `).join('');
                } else {
                    serviceList.innerHTML = '<p style="color: #999; text-align: center;">Không có dịch vụ nào</p>';
                }
            } catch (error) {
                const serviceList = document.getElementById('serviceOrderList');
                serviceList.innerHTML = '<p style="color: #f44336; text-align: center;">Lỗi khi tải danh sách dịch vụ: ' + error.message + '</p>';
            }
        }

        function closeServiceOrderModal() {
            const modal = document.getElementById('serviceOrderModal');
            if (modal) {
                modal.remove();
            }
        }

        async function orderService(bookingId, serviceId, serviceName, price) {
            if (!confirm(`Bạn có chắc chắn muốn đặt dịch vụ "${serviceName}" với giá ${price.toLocaleString('vi-VN')} VNĐ?`)) {
                return;
            }

            try {
                await ServiceAPI.requestService({
                    booking_id: bookingId,
                    service_id: serviceId,
                    quantity: 1
                });
                showNotification('Đặt dịch vụ thành công!', 'success');
                closeServiceOrderModal();
                
                // Reload checkout summary and update total price
                await updateBookingTotalPrice(bookingId);
            } catch (error) {
                showNotification('Lỗi khi đặt dịch vụ: ' + error.message, 'error');
            }
        }

        async function updateBookingTotalPrice(bookingId) {
            try {
                // Reload checkout summary
                const summary = await CheckInAPI.getCheckoutSummary(bookingId);
                
                // Update stored data
                if (currentBookingsData[bookingId]) {
                    currentBookingsData[bookingId].checkoutSummary = summary;
                }
                
                // Update UI
                const totalPriceElement = document.getElementById(`totalPrice-${bookingId}`);
                if (totalPriceElement) {
                    const booking = currentBookingsData[bookingId]?.booking;
                    if (booking) {
                        const bookingPrice = booking.total_price || 0;
                        const serviceCost = summary.service_cost || 0;
                        const total = bookingPrice + serviceCost;
                        
                        totalPriceElement.innerHTML = `
                            ${total.toLocaleString('vi-VN')} VNĐ
                            ${serviceCost > 0 ? `
                                <p style="margin: 4px 0 0 0; color: #666; font-size: 11px;">
                                    (Phòng: ${bookingPrice.toLocaleString('vi-VN')} VNĐ + Dịch vụ: ${serviceCost.toLocaleString('vi-VN')} VNĐ)
                                </p>
                            ` : ''}
                        `;
                    }
                }
            } catch (error) {
                console.warn('Could not update booking total price:', error);
            }
        }

        async function viewOrderedServices(bookingId) {
            // Create modal HTML
            const modal = document.createElement('div');
            modal.id = 'orderedServicesModal';
            modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;';
            
            modal.innerHTML = `
                <div style="background: white; border-radius: 12px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 style="margin: 0;">Dịch Vụ Đã Đặt</h2>
                        <button onclick="closeOrderedServicesModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #999;">&times;</button>
                    </div>
                    <div id="orderedServicesList" style="margin-bottom: 20px;">
                        <p style="text-align: center; color: #999;">Đang tải danh sách dịch vụ...</p>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);

            // Load service requests
            try {
                const summary = await CheckInAPI.getCheckoutSummary(bookingId);
                const serviceList = document.getElementById('orderedServicesList');
                
                if (summary.service_requests && summary.service_requests.length > 0) {
                    const totalServiceCost = summary.service_cost || 0;
                    
                    serviceList.innerHTML = `
                        ${summary.service_requests.map(sr => `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 12px; background: #f9f9f9;">
                                <div style="flex: 1;">
                                    <h4 style="margin: 0 0 4px 0; font-size: 16px; color: #333;">${sr.service_name || 'Dịch vụ'}</h4>
                                    <p style="margin: 0; color: #666; font-size: 13px;">
                                        Số lượng: ${sr.quantity || 1} • 
                                        Đơn giá: ${(sr.unit_price || 0).toLocaleString('vi-VN')} VNĐ
                                    </p>
                                    <p style="margin: 4px 0 0 0; font-size: 12px;">
                                        ${sr.status === 'completed' ? '✅ Đã hoàn thành' : 
                                          sr.status === 'in_progress' ? '⏳ Đang xử lý' : 
                                          sr.status === 'pending' ? '⏸️ Chờ xử lý' : 
                                          '❌ Đã hủy'}
                                    </p>
                                </div>
                                <div style="text-align: right;">
                                    <strong style="color: #0066cc; font-size: 16px;">${(sr.total_price || 0).toLocaleString('vi-VN')} VNĐ</strong>
                                </div>
                            </div>
                        `).join('')}
                        <div style="margin-top: 16px; padding-top: 16px; border-top: 2px solid #0066cc;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <strong style="font-size: 18px; color: #333;">Tổng chi phí dịch vụ:</strong>
                                <strong style="font-size: 20px; color: #0066cc;">${totalServiceCost.toLocaleString('vi-VN')} VNĐ</strong>
                            </div>
                        </div>
                    `;
                } else {
                    serviceList.innerHTML = '<p style="color: #999; text-align: center; padding: 40px 0;">Chưa có dịch vụ nào được đặt</p>';
                }
            } catch (error) {
                const serviceList = document.getElementById('orderedServicesList');
                serviceList.innerHTML = '<p style="color: #f44336; text-align: center;">Lỗi khi tải danh sách dịch vụ: ' + error.message + '</p>';
            }
        }

        function closeOrderedServicesModal() {
            const modal = document.getElementById('orderedServicesModal');
            if (modal) {
                modal.remove();
            }
        }

        function viewRoomDetails(bookingId) {
            window.location.href = `my-bookings.html#booking-${bookingId}`;
        }

        window.openServiceOrderModal = openServiceOrderModal;
        window.closeServiceOrderModal = closeServiceOrderModal;
        window.orderService = orderService;
        window.viewRoomDetails = viewRoomDetails;
        window.viewOrderedServices = viewOrderedServices;
        window.closeOrderedServicesModal = closeOrderedServicesModal;


        async function loadUserProfile(userId) {
            try {
                const user = await UserAPI.getUser(userId);
                document.getElementById('profile_full_name').value = user.full_name || '';
                document.getElementById('profile_email').value = user.email || '';
                document.getElementById('profile_phone').value = user.phone || '';
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

    </script>
    <script src="js/script.js"></script>
</body>
</html>
