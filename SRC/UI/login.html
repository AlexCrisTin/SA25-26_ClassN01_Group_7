<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Demacia Hotel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">
                    <span class="logo-text">Demacia</span>
                </div>
                <div style="position: absolute; top: 20px; right: 20px;">
                    <div class="language-switcher">
                        <button class="lang-btn" id="langVi" onclick="LanguageManager.setLanguage('vi')">VI</button>
                        <span class="lang-separator">|</span>
                        <button class="lang-btn" id="langEn" onclick="LanguageManager.setLanguage('en')">EN</button>
                    </div>
                </div>
                <h2 data-i18n="auth.loginTitle">Đăng Nhập</h2>
                <p data-i18n="auth.welcomeBack">Chào mừng bạn trở lại!</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username" data-i18n="auth.username">Tên đăng nhập</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="auth.password">Mật khẩu</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember">
                        <span data-i18n="auth.rememberMe">Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="forgot-password" data-i18n="auth.forgotPassword">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="auth-btn" id="loginBtn" data-i18n="auth.login">Đăng Nhập</button>

                <div class="auth-footer">
                    <p><span data-i18n="auth.noAccount">Chưa có tài khoản?</span> <a href="register.html" data-i18n="auth.registerNow">Đăng ký ngay</a></p>
                    <a href="index.html" class="back-home" data-i18n="auth.backHome">← Về trang chủ</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/language.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');

            if (AuthManager.isLoggedIn()) {
                window.location.href = AuthManager.getRedirectUrl();
                return;
            }

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    showNotification('Vui lòng điền đầy đủ thông tin', 'error');
                    return;
                }

                setLoading(loginBtn, true);

                const result = await AuthManager.login(username, password);

                setLoading(loginBtn, false);

                if (result.success) {
                    showNotification('Đăng nhập thành công!', 'success');
                    setTimeout(() => {
                        window.location.href = AuthManager.getRedirectUrl();
                    }, 1000);
                } else {
                    showNotification(result.error || 'Đăng nhập thất bại', 'error');
                }
            });
        });
    </script>
    <script src="js/script.js"></script>
</body>
</html>
